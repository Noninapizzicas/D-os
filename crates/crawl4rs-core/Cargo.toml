[package]
name = "crawl4rs-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Núcleo de Crawl4RS: orquestación del crawl (fetch → limpieza → markdown → extracción)."
authors.workspace = true

[features]
default = ["browser", "cache", "extract", "http", "pdf"]
# Fetcher real vía Chromium/CDP, con modo stealth. Desactivable para builds
# ligeros sin navegador.
browser = ["dep:chromiumoxide", "dep:tokio", "dep:crawl4rs-stealth"]
# Caché de resultados (RAM + disco con sled).
cache = ["dep:crawl4rs-cache"]
# Extracción estructurada (CSS, densidad semántica) integrada en el crawler.
extract = ["dep:crawl4rs-extract"]
# Fetch HTTP rápido sin navegador (reqwest).
http = ["dep:reqwest", "dep:tokio"]
# Extracción de texto de PDF digital (sin OCR). Fuera del build `minimal`.
pdf = ["dep:pdf-extract"]
# Marcha larga: fetcher que delega en el wrapper HTTP de Playwright (puente
# determinista; el MCP se reserva para la capa de agente). Opt-in.
playwright = ["dep:reqwest", "dep:tokio"]

[dependencies]
crawl4rs-markdown.workspace = true
crawl4rs-cache = { workspace = true, optional = true }
crawl4rs-stealth = { workspace = true, optional = true }
crawl4rs-extract = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
pdf-extract = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
url = { workspace = true }
futures = { workspace = true }
chromiumoxide = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "time", "sync"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
