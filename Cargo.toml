[workspace]
resolver = "2"
members = [
    "crates/crawl4rs-core",
    "crates/crawl4rs-markdown",
    "crates/crawl4rs-extract",
    "crates/crawl4rs-cache",
    "crates/crawl4rs-stealth",
    "crates/crawl4rs-server",
    "crates/crawl4rs-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noninapizzicas/d-os"
description = "Crawl4RS — convierte cualquier página web en Markdown limpio y listo para LLMs, en un binario estático de Rust."
authors = ["Crawl4RS contributors"]

[workspace.dependencies]
# Crates internos
crawl4rs-core = { path = "crates/crawl4rs-core", version = "0.0.1" }
crawl4rs-markdown = { path = "crates/crawl4rs-markdown", version = "0.0.1" }
crawl4rs-extract = { path = "crates/crawl4rs-extract", version = "0.0.1" }
crawl4rs-cache = { path = "crates/crawl4rs-cache", version = "0.0.1" }
crawl4rs-stealth = { path = "crates/crawl4rs-stealth", version = "0.0.1" }
crawl4rs-server = { path = "crates/crawl4rs-server", version = "0.0.1" }

# Runtime asíncrono
tokio = { version = "1", default-features = false }
async-trait = "0.1"
futures = "0.3"

# Control de navegador (CDP)
chromiumoxide = "0.9"

# Serialización y errores
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"

# Observabilidad
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Parsing / utilidades
scraper = "0.20"
ego-tree = "0.6"
url = "2"
lru = "0.12"
clap = { version = "4", features = ["derive"] }

# Caché persistente en disco
sled = "0.34"

# Cliente HTTP (fetch rápido sin navegador)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }

# Extracción de texto de PDF digital (sin dep nativa; OCR fuera)
pdf-extract = "0.12"

# Servidor HTTP / API
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
# Objetivo de la visión: binario estático pequeño (< 20 MB en imagen Docker).
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
